{% extends "base_login.html" %}

{% block content %}

  {% if maintenance %}
  <div class="alert alert-warning py-2 px-3 mb-4" role="alert" style="border-left:4px solid #f0ad4e;">
    <strong>Maintenance en cours.</strong>
    {% if maintenance_until %}
      Fin estimée: {{ maintenance_until|local_dt }}.
    {% else %}
      Fin estimée bientôt.
    {% endif %}
  </div>
  {% endif %}

  <div class="text-center mb-3">
    <img src="{{ url_for('static', filename='img/repairkawap.png') }}" alt="RepairKawapp" style="max-width:200px; height:auto;" />
  </div>
  <form class="form-signin" method="POST" action="{{url_for('auth.login_post')}}">
  <h1 class="h3 mb-3 fw-normal">Connectez-vous</h1>

    <div class="form-floating">
      <input type="email" name="email" class="form-control" placeholder="name@example.com">
      <label for="floatingInput">Courriel</label>
    </div>
    <div class="form-floating mb-5">
      <input type="password" name="password" class="form-control" placeholder="Password" style="cursor: auto;">
      <label for="floatingPassword">Mot de Passe</label>
    </div>

    <button class="w-100 btn btn-lg btn-primary" type="submit">Connexion</button>
  </form>
  <a href="{{url_for('auth.forgot_password')}}">Mot de passe oublié 😰</a>

{% endblock %}
