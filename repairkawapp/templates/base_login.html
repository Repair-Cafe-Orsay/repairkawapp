<!DOCTYPE html>
<html lang=fr>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="/static/img/favicon.ico" type="image/vnd.microsoft.icon">
    <title>RepairKawapp</title>
    <link href="/static/bootstrap-5.1.1-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="/static/js/jquery-2.2.0.min.js"></script>
</head>

<body>

    <main>
      <div class="left-container">

        <div class="text-center content">
              {% with messages = get_flashed_messages() %}
              {% if messages %}
                  <div class="alert alert-danger">
                      {{ messages[0] }}
                  </div>
              {% endif %}
              {% endwith %}

               {% block content %}
               {% endblock %}
        </div>
      </div>
      <div class="right-container">
      </div>
    </main>

      <footer class="mt-auto bg-light py-2">
        <div class="container small d-flex flex-column flex-md-row align-items-center justify-content-md-between">
          <span class="text-muted mb-1 mb-md-0">© 2025 Repair Café Orsay</span>
          <a href="https://www.repaircafe.org/fr/fondation/" target="_blank" rel="noopener" class="text-decoration-none mb-1 mb-md-0 mx-md-auto">Fondation Repair Café</a>
          <a href="{{ url_for('main.repaircafes_public') }}" class="link-secondary mt-1 mt-md-0">Repair Cafés</a>
        </div>
      </footer>

</body>

</html>
