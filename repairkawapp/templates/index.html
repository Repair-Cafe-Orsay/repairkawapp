{% extends "base.html" %}

{% block content %}
  <div class="row mb-3">
    <button id="btn-new-repair" class="col-3 btn btn-primary btn-lg" type="button">Nouvelle fiche</button>
  </div>
  <div class="row mb-3">
      <label class="col-sm-2 col-form-label">Réparateurs</label>
      <div class="col-sm-3">
        <select class="form-select" id="search_user" name="users">
          <option value="" selected>Tous</option>
            <option value="0">Pas attribué</option>
            <option disabled>-----------</option>
        {% for user in users %}
            <option value="{{user.id}}">{{user.name}}</option>
        {% endfor %}
        </select>
      </div>
      <label class="col-sm-1 col-form-label">Séance</label>
      <div class="col-sm-2">
        <div class="input-group input-group-sm">
          <input type="number" min="1" class="form-control form-control-sm" id="search_session" placeholder="#" aria-label="Filtre séance">
          <button type="button" class="btn btn-outline-secondary" id="btn-clear-session" style="display:none" title="Effacer le filtre" aria-label="Effacer">&times;</button>
        </div>
      </div>
      <label class="col-sm-1 col-form-label">Statut</label>
      <div class="col-sm-2">
        <select class="form-select form-select-sm" id="search_status" name="users">
          <option value="all" selected>Tous</option>
            <option value="opened">En cours</option>
            <option value="closed">Clos</option>
        </select>
      </div>
    </div>
     
    <table id="search_result_id" class="display">
      <thead>
          <tr>
              <th></th>
              <th>ID</th>
              <th class="classStatus">Statut</th>
              <th>Catégorie</th>
              <th>Type</th>
              <th>Marque</th>
              <th>Visiteur</th>
          </tr>
      </thead>
        <tbody>
      </tbody>
    </table> 
    <script>
      function ensureSessionFirstConfirm(callback) {
        $.getJSON('/api/sessions?opened=1', function(data){
          if (data.length === 0) {
            if (!confirm('Aucune séance ouverte. Créer une fiche hors séance ?')) return;
          }
          callback();
        });
      }
      $('#btn-new-repair').on('click', function(){
        ensureSessionFirstConfirm(function(){ window.location = '/new'; });
      });
      $('#search-button').click(function(event){
        // Prevent redirection with AJAX for contact form
        var form = $('#search-form');
        var id = form.prop('id');
        var name = form.prop('name');
        var category = form.prop('category');
        $.getJSON("{{url_for('api.repairsearch')}}",{
                        id: id,
                        name: name,
                        category: category
                    }, function(data) {
                        console.log(data)
                    });
      });
      $(document).ready( function () {
            function sessionPrefillFromQuery() {
              const params = new URLSearchParams(window.location.search);
              if (params.has('session_id')) {
                $('#search_session').val(params.get('session_id'));
              } else if (params.has('session')) {
                $('#search_session').val(params.get('session'));
              }
            }
            sessionPrefillFromQuery();
            search_table = $('#search_result_id').DataTable({ajax: {url: '{{ url_for("api.repairsearch") }}',
                                                             dataSrc: "repairs",
                                                             data: function(d) { d.user= $("#search_user").val(); d.status= $("#search_status").val(); const ss=$('#search_session').val(); if (ss) d.session_id=ss;}},
                                              "serverSide": true,
                                              "searching": true,
                                              "ordering":  false,
                                              "stateSave": true,
                                              columnDefs: [{
                                                targets: 2,
                                                className: "dt-center"
                                              }],
                                              "language": {
                                                  "decimal":        "",
                                                  "emptyTable":     "Pas de données disponibles",
                                                  "info":           "Affiche de _START_ à _END_ sur _TOTAL_ entrées",
                                                  "infoEmpty":      "Affiche 0 à 0 sur 0 entrées",
                                                  "infoFiltered":   "(sur _MAX_ entrées au total)",
                                                  "infoPostFix":    "",
                                                  "thousands":      ",",
                                                  "lengthMenu":     "Affiche _MENU_ entrées",
                                                  "loadingRecords": "Chargement...",
                                                  "processing":     "En cours...",
                                                  "search":         "Recherche :",
                                                  "zeroRecords":    "Aucune réparation ne correspond",
                                                  "paginate": {
                                                      "first":      "Premier",
                                                      "last":       "Dernier",
                                                      "next":       "Suivant",
                                                      "previous":   "Précédent"
                                                  }
                                              },
                                              columns: [ {"defaultContent": "<button>Voir</button>"},
                                                         { data: 'id'},
                                                         { data: 'close_status'},
                                                         { data: 'category'},
                                                         { data: 'otype'},
                                                         { data: 'brand'},
                                                         { data: 'name'}]});
            $('#search_result_id tbody').on( 'click', 'button', function () {
                  var data = search_table.row( $(this).parents('tr') ).data();
                  window.location.href="/update/"+data.id;
            })
            $('#search_user').change(function () {
                  search_table.ajax.reload()
            })
            $('#search_status').change(function () {
                  search_table.ajax.reload()
            })
      function updateSessionResetBtn(){
        const hasVal = !!$('#search_session').val();
        $('#btn-clear-session').toggle(hasVal);
      }
      $('#search_session').on('change keyup', function(){
          search_table.ajax.reload();
          updateSessionResetBtn();
      });
      $('#btn-clear-session').on('click', function(){
        $('#search_session').val('');
        // retirer paramètre de l'URL sans recharger la page entière
        const url = new URL(window.location.href);
        url.searchParams.delete('session_id');
        url.searchParams.delete('session');
        window.history.replaceState({}, '', url.toString());
        search_table.ajax.reload();
        updateSessionResetBtn();
      });
      if ($('#search_session').val()) {
        search_table.ajax.reload();
      }
      updateSessionResetBtn();
      } );
  // (Deuxième confirmation déplacée dans la page /new elle-même)
    </script>
    </form>
  </div>

{% endblock %}
