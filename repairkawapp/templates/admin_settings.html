{% extends 'base.html' %}
{% block content %}
<h2>Paramètres site</h2>
<form method="post" action="{{ url_for('admin.settings_page') }}" class="mt-3" novalidate>
  <div class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" id="maintenance_mode" name="maintenance_mode" value="1" {% if setting.maintenance_mode %}checked{% endif %}>
    <label class="form-check-label" for="maintenance_mode">Mode maintenance (bloque connexion non-admin)</label>
  </div>
  <div class="mb-3" style="max-width:22rem">
    <label for="maintenance_until" class="form-label">Fin estimée (optionnel)</label>
    <input type="datetime-local" class="form-control" id="maintenance_until" name="maintenance_until" value="{% if setting.maintenance_until %}{{ setting.maintenance_until.strftime('%Y-%m-%dT%H:%M') }}{% endif %}">
    <div class="form-text">Affichée sur la page de login si renseignée.</div>
  </div>
  <button class="btn btn-primary" type="submit">Enregistrer</button>
</form>
{% if MAINTENANCE_MODE %}
<div class="alert alert-warning mt-4 mb-0 small">Le mode maintenance est actif{% if MAINTENANCE_UNTIL %} jusqu'à {{ MAINTENANCE_UNTIL|local_dt }}{% endif %}.</div>
{% endif %}
{% endblock %}
