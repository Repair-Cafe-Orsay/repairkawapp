{% extends "base.html" %}

{% block content %}
<h1 class="title mb-3">Bienvenue {{ name }}</h1>

<div class="d-flex align-items-center gap-3 flex-wrap mb-2">
  <label class="form-label fw-semibold m-0" for="reportrange">Période sélectionnée :</label>
  <div id="reportrange" style="background:#fff; cursor:pointer; padding:6px 12px; border:1px solid #ccc; min-width:320px; border-radius:6px;">
    <i class="fa fa-calendar"></i>&nbsp;<span></span> <i class="fa fa-caret-down"></i>
  </div>
</div>
  <hr class="mt-2 mb-3">
  <div class="row mb-3">
    <div class="card border-secondary col-sm-12 col-lg-6 update rounded g-0">
      <div class="card-header text-center">Comptes par statuts</div>
      <div class="card-body"><div id="count_status"></div></div>
    </div>
    <div class="card border-secondary col-sm-12 col-lg-6 update rounded g-0">
      <div class="card-header text-center">Comptes par catégories</div>
      <div class="card-body"><div id="count_category"></div></div>
    </div>
  </div>
  <div class="row mb-3">
    <div class="card border-secondary col-sm-12 col-lg-6 update rounded g-0">
      <div class="card-header text-center">Fréquentation</div>
      <div class="card-body text-center">
        <div id="count_visitors" class="mb-2"></div>
        <div id="count_sessions" class=""></div>
      </div>
    </div>
    <div class="card border-secondary col-sm-12 col-lg-6 update rounded g-0">
      <div class="card-header text-center">Top 20 types d'objet</div>
      <div class="card-body p-3">
        <ol id="top_object_types" class="m-0 ps-3 small" style="columns:2; -webkit-columns:2; -moz-columns:2; column-gap:2rem; padding-right:0.5rem;">
        </ol>
      </div>
    </div>
  </div>

<script type="text/javascript">
 // Reprise logique stats ancien profil
 var width = 400; var height = 400; var margin = 50; var bottom_margin = 120; var radius = Math.min(width, height) / 2 - margin;
 function d3_display(data) {
   var status_label = data["status"]; var category_label = data["categories"]; var categories = {}; var status = {}; var totalCount = data["total"]; var color = d3.scaleOrdinal().range(["#5A39AC", "#DD98D6", "#E7C820", "#08B2B2"]);
   for(var status_id=1; status_id<=status_label.length; status_id++) { if (status_id in data["count_by_status"]) { var value = data["count_by_status"][status_id]; status[status_label[status_id-1]] = value[1]; } }
   var max_count_category = 0; for(var idx=0;idx<category_label.length;idx++) { var c = category_label[idx][0]; var value = (c in data["count_by_category"]) ? data["count_by_category"][c][0] : 0; categories[c] = value; if (value>max_count_category) max_count_category=value; }
   var pie = d3.pie().sort(null).value(function(d){return d.value;}); var data_ready = pie(d3.entries(status)); var arc = d3.arc().outerRadius(radius * 0.5).innerRadius(radius * 0.8); var outerArc = d3.arc().innerRadius(radius * 0.9).outerRadius(radius * 0.9);
   d3.select('#count_status svg').remove(); var svg = d3.select('#count_status').append('svg').attr('width', width).attr('height', height).append('g').attr('transform', 'translate('+width/2+','+height/2+')');
   svg.selectAll('allSlices').data(data_ready).enter().append('path').attr('d', arc).attr('fill', function(d){ return(color(d.data.key)) }).attr('stroke','white').style('stroke-width','2px').style('opacity',0.7);
   svg.selectAll('allLabels').data(data_ready).enter().append('text').text(function(d){return d.data.key}).attr('transform', function(d){return 'translate('+arc.centroid(d)+')';}).style('text-anchor','middle');
   svg.selectAll('allLabels').data(data_ready).enter().append('text').text(function(d){return d.data.value}).attr('transform', function(d){return 'translate('+outerArc.centroid(d)+')';}).style('text-anchor', function(d){var midangle=d.startAngle+(d.endAngle-d.startAngle)/2; return (midangle < Math.PI ? 'start':'end');});
   svg.append('text').text(totalCount).attr('class','label');
   d3.select('#count_category svg').remove(); var svg2 = d3.select('#count_category').append('svg').attr('width',width).attr('height',height).append('g').attr('transform','translate('+bottom_margin+','+margin+')');
   var dataCat = d3.entries(categories); var x = d3.scaleBand().range([0,width-margin-bottom_margin]).domain(dataCat.map(function(d){return d.key;})).padding(0.2); svg2.append('g').attr('transform','translate(0,'+(height-margin-bottom_margin)+')').call(d3.axisBottom(x)).selectAll('text').attr('transform','translate(-10,0)rotate(-45)').style('text-anchor','end');
   var y = d3.scaleLinear().domain([0,max_count_category]).range([height-margin-bottom_margin,0]); svg2.append('g').call(d3.axisLeft(y));
   svg2.selectAll('mybar').data(dataCat).enter().append('rect').attr('x', function(d){return x(d.key);}).attr('y', function(d){return y(d.value);}).attr('width', x.bandwidth()).attr('height', function(d){return height - margin - bottom_margin - y(d.value);}).attr('fill','#69b3a2');
   d3.select('#count_visitors svg').remove(); var svg3 = d3.select('#count_visitors').append('svg').attr('width',width).attr('height',height).append('g').attr('transform','translate('+bottom_margin+','+margin+')'); svg3.append('text').text(totalCount).attr('class','label');
 }
 $(function(){
   // Période académique: 1er sept année départ -> 31 août année suivante
   var today = moment();
   var academicStartYear = (today.month() >= 8) ? today.year() : (today.year() - 1); // année de début de l'année académique courante
   // Par défaut (hors début d'année académique) on montre l'année académique courante tronquée à aujourd'hui.
   var start = moment({year: academicStartYear, month:8, day:1});
   var end = moment({year: academicStartYear+1, month:7, day:31});
   // Demande: entre septembre et janvier afficher par défaut l'année académique précédente complète.
   // Interprétation: pour les mois de septembre à décembre (mois 8..11), on remonte d'une année.
   if (today.month() >= 8) { // Septembre, Octobre, Novembre, Décembre
     start = moment({year: academicStartYear-1, month:8, day:1});
     end = moment({year: academicStartYear, month:7, day:31});
   } else if (today.month() === 0) {
     // Janvier: academicStartYear pointe déjà sur l'année précédente (car month()<8), on garde l'année précédente complète
     start = moment({year: academicStartYear, month:8, day:1});
     end = moment({year: academicStartYear+1, month:7, day:31});
   } else {
     // Février à Août: année académique courante partielle jusqu'à aujourd'hui
     if (today.isBefore(end)) { end = today; }
   }
   function cb(start,end){
     $('#reportrange span').html(start.format('D MMM YYYY') + ' – ' + end.format('D MMM YYYY'));
     $.getJSON("{{url_for('api.stats')}}", { from: start.format('YYYY-MM-D'), to: end.format('YYYY-MM-D') }, function(data){
        d3_display(data);
        // Affichage fréquentation distinct (texte clair)
        if (data) {
          $('#count_visitors').html('<div class="label">Visiteurs uniques: '+ (data.visitors !== undefined ? data.visitors : '?') +'</div>');
          $('#count_sessions').html('<div class="label">Séances: '+ (data.total_sessions !== undefined ? data.total_sessions : '?') +'</div>');
          // Top object types
          var list = $('#top_object_types');
          list.empty();
          if (data.top_object_types && data.top_object_types.length) {
            data.top_object_types.forEach(function(item){
              var li = $('<li></li>').text(item.name + ' – ' + item.count);
              list.append(li);
            });
          } else {
            list.append($('<li></li>').text('Aucun'));
          }
        }
     });
   }
   $('#reportrange').daterangepicker({
     locale: french_daterangepicker,
     startDate:start,
     endDate:end,
     ranges:{
  "Année académique courante":[ start, moment({year: academicStartYear+1, month:7, day:31}) ],
  "Dernière année académique":[ moment({year: academicStartYear-1, month:8, day:1}), moment({year: academicStartYear, month:7, day:31}) ],
       "Aujourd'hui":[moment(),moment()],
       'Depuis une semaine':[moment().subtract(6,'days'), moment()],
       'Depuis un mois':[moment().subtract(29,'days'), moment()],
       'Cette année civile':[moment().startOf('year'), moment().endOf('year')]
     }
   }, cb);
   cb(start,end);
 });
</script>
{% endblock %}
