[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "B",  # flake8-bugbear
  "I",  # isort
]
ignore = [
  "E203",  # whitespace before ':' (compatible avec black)
]
exclude = [
  "alembic/versions/*",  # migrations (générées)
]

[tool.ruff.lint.isort]
known-first-party = ["repairkawapp"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = []
exclude = ["alembic/versions/.*"]

[tool.coverage.run]
branch = true
source = ["repairkawapp"]
omit = ["*/tests/*", "alembic/versions/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
